name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # mypy is intentionally not installed here. The mypy-integration tests run once in the `types` job below
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-benchmark typing_extensions

      - name: Run tests
        run: pytest

  types:
    # mypy only needs to run once, not across the whole matrix
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e .
          # pytest-benchmark is needed because pyproject's pytest addopts reference it.
          pip install "mypy==2.1.*" pytest pytest-benchmark typing_extensions

      - name: Type-check runtype
        run: mypy runtype/

      - name: Run mypy-integration tests
        run: pytest tests/test_mypy.py
